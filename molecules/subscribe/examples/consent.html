<form class="es-subscribe" data-layout="inset" action="#" method="post">
  <div class="es-subscribe__field">
    <input class="es-input" type="email" name="email" placeholder="Your email address" aria-label="Email address" autocomplete="email" required>
    <button class="es-button" type="submit">Subscribe</button>
  </div>
  <label class="es-checkbox es-subscribe__consent"><input type="checkbox" name="consent" required><span>I agree to receive newsletters and accept the <a href="#">privacy statement</a>.</span></label>
</form>
