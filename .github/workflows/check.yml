name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails if catalog/index.json, tokens/dist or integrations/react were not rebuilt.
      - run: npm run check
      - run: npx vite build --config app/vite.config.js
